packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true

minimumReleaseAge: 2880

onlyBuiltDependencies:
  - '@sentry/cli'
  - esbuild
  - msgpackr-extract

auditConfig:
  # pnpm 10 syntax. extract-zip has no fixed release; the local patch rejects
  # escaping symlink targets. Migrate this to audit.ignore when pnpm 11 is safe.
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv

overrides:
  '@babel/core@<=7.29.0': 7.29.7
  '@opentelemetry/core': 2.9.0
  body-parser@>=2.0.0 <2.3.0: 2.3.0
  brace-expansion@>=5.0.0 <5.0.9: 5.0.9
  brace-expansion@<1.1.18: 1.1.18
  esbuild: 0.28.1
  fast-uri@>=3.0.0 <3.1.5: 3.1.5
  form-data@>=4.0.0 <4.0.6: 4.0.6
  nanoid@>=3.0.0 <3.3.18: 3.3.18
  postcss: 8.5.23
  js-yaml@>=3.0.0 <3.15.1: 3.15.1
  qs@>=6.11.1 <=6.15.1: 6.15.3
  '@lhci/cli>uuid': 11.1.1
  request-oauth>uuid: 11.1.1
  sharp@<0.35.0: 0.35.3
  tmp@<0.2.7: 0.2.7
  undici@>=7.0.0 <7.29.0: 7.29.0
  vite: 8.0.16
  ws@>=7.0.0 <7.5.11: 7.5.11
  ws@>=8.0.0 <8.21.0: 8.21.0

patchedDependencies:
  '@colyseus/sdk@0.17.43': patches/@colyseus__sdk@0.17.43.patch
  extract-zip@2.0.1: patches/extract-zip@2.0.1.patch

syncInjectedDepsAfterScripts:
  - build
