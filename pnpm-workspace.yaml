packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true

minimumReleaseAge: 2880

allowBuilds:
  '@sentry/cli': true
  esbuild: true
  msgpackr-extract: true

auditConfig:
  # extract-zip has no fixed release; the local patch rejects escaping symlink
  # targets, so the corresponding GHSA remains explicitly acknowledged.
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv

overrides:
  '@babel/core@<=7.29.0': 7.29.7
  '@opentelemetry/core': 2.10.0
  body-parser@>=2.0.0 <2.4.0: 2.4.0
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  brace-expansion@<1.1.21: 1.1.21
  compression@>=1.0.0 <1.8.2: 1.8.2
  esbuild: 0.28.1
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  form-data@>=4.0.0 <4.0.6: 4.0.6
  nanoid@>=3.0.0 <3.3.18: 3.3.18
  postcss: 8.5.23
  proxy-addr@>=1.1.0 <2.0.8: 2.0.8
  ip-address@>=10.0.0 <10.7.1: 10.7.1
  js-yaml@>=3.0.0 <3.15.2: 3.15.2
  qs@>=6.7.0 <6.16.1: 6.16.1
  '@lhci/cli>uuid': 11.1.1
  # v6 keeps get-uri's API; separate FTP transfer hosts now fail closed.
  get-uri>basic-ftp: 6.2.1
  # trace_engine asks for "latest"; retain the measured Lighthouse attribution data.
  '@paulirish/trace_engine>third-party-web': 0.29.2
  '@paulirish/trace_engine>legacy-javascript': 0.0.1
  request-oauth>uuid: 11.1.1
  sharp@<0.35.5: 0.35.5
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  tmp@<0.2.7: 0.2.7
  undici@>=7.0.0 <7.29.0: 7.29.0
  undici@>=8.0.0 <8.12.2: 8.12.3
  vite: 8.2.4
  ws@>=7.0.0 <7.5.11: 7.5.11
  ws@>=8.0.0 <8.21.0: 8.21.0
  # Colyseus core pins zod ^4.1; zod 3 consumers are dev-only and stay untouched.
  zod@>=4.0.0 <4.6.6: 4.6.7

patchedDependencies:
  '@colyseus/sdk@0.18.2': patches/@colyseus__sdk@0.18.2.patch
  extract-zip@2.0.1: patches/extract-zip@2.0.1.patch

syncInjectedDepsAfterScripts:
  - build
