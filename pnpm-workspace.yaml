packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true

minimumReleaseAge: 2880

# Explicitly approved Next 16.4.0 upgrade; keep the age gate for every other release.
minimumReleaseAgeExclude:
  - next@16.4.0
  - '@next/env@16.4.0'
  - '@next/playwright@16.4.0'
  - '@next/swc-darwin-arm64@16.4.0'
  - '@next/swc-darwin-x64@16.4.0'
  - '@next/swc-linux-arm64-gnu@16.4.0'
  - '@next/swc-linux-arm64-musl@16.4.0'
  - '@next/swc-linux-x64-gnu@16.4.0'
  - '@next/swc-linux-x64-musl@16.4.0'
  - '@next/swc-win32-arm64-msvc@16.4.0'
  - '@next/swc-win32-x64-msvc@16.4.0'

allowBuilds:
  '@sentry/cli': true
  esbuild: true
  msgpackr-extract: true

auditConfig:
  # extract-zip has no fixed release; the local patch rejects escaping symlink
  # targets, so the corresponding GHSA remains explicitly acknowledged.
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv

overrides:
  '@babel/core@<=7.29.0': 7.29.7
  '@opentelemetry/core': 2.10.0
  body-parser@>=2.0.0 <2.3.0: 2.3.0
  brace-expansion@>=5.0.0 <5.0.11: 5.0.11
  brace-expansion@<1.1.18: 1.1.18
  esbuild: 0.28.1
  fast-uri@>=3.0.0 <3.1.7: 3.1.7
  form-data@>=4.0.0 <4.0.6: 4.0.6
  nanoid@>=3.0.0 <3.3.18: 3.3.18
  postcss: 8.5.23
  proxy-addr@>=1.1.0 <2.0.8: 2.0.8
  js-yaml@>=3.0.0 <3.15.1: 3.15.1
  qs@>=6.11.1 <6.16.0: 6.16.0
  '@lhci/cli>uuid': 11.1.1
  # trace_engine asks for "latest"; retain the measured Lighthouse attribution data.
  '@paulirish/trace_engine>third-party-web': 0.29.2
  request-oauth>uuid: 11.1.1
  sharp@<0.35.5: 0.35.5
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  tmp@<0.2.7: 0.2.7
  undici@>=7.0.0 <7.29.0: 7.29.0
  undici@>=8.1.0 <8.10.2: 8.10.2
  vite: 8.2.2
  ws@>=7.0.0 <7.5.11: 7.5.11
  ws@>=8.0.0 <8.21.0: 8.21.0

patchedDependencies:
  '@colyseus/sdk@0.18.2': patches/@colyseus__sdk@0.18.2.patch
  extract-zip@2.0.1: patches/extract-zip@2.0.1.patch

syncInjectedDepsAfterScripts:
  - build
