name: Release images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build immutable images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate release observability
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          test -n "$NEXT_PUBLIC_SENTRY_DSN"
          test -n "$SENTRY_ORG"
          test -n "$SENTRY_PROJECT"
          test -n "$SENTRY_AUTH_TOKEN"

      - name: Validate migration rollback compatibility
        run: node scripts/check-migration-safety.mjs

      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web
        id: web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.PRODUCTION_APP_URL }}
            NEXT_PUBLIC_GAME_SERVER_URL=${{ vars.PRODUCTION_GAME_SERVER_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            RELEASE_VERSION=${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            better_auth_secrets=1:release-build-only-better-auth-secret-000000
            game_token_secret=release-build-only-game-token-secret-000000
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build migrator
        id: migrator
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          target: migrator
          push: true
          tags: ghcr.io/${{ github.repository }}/migrator:${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

      - name: Build game server
        id: game
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/game-server/Dockerfile
          target: runner
          push: true
          tags: ghcr.io/${{ github.repository }}/game:${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=game
          cache-to: type=gha,mode=max,scope=game

      - name: Create release manifest
        env:
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          GAME_DIGEST: ${{ steps.game.outputs.digest }}
          MIGRATOR_DIGEST: ${{ steps.migrator.outputs.digest }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const repository = process.env.GITHUB_REPOSITORY.toLowerCase();
          const sha = process.env.GITHUB_SHA;
          const journal = JSON.parse(readFileSync("packages/database/drizzle/meta/_journal.json", "utf8"));
          const manifest = {
            schemaVersion: 1,
            releaseVersion: sha,
            sourceCommit: sha,
            migrationHead: journal.entries.at(-1).tag,
            createdAt: new Date().toISOString(),
            images: {
              web: `ghcr.io/${repository}/web@${process.env.WEB_DIGEST}`,
              game: `ghcr.io/${repository}/game@${process.env.GAME_DIGEST}`,
              migrator: `ghcr.io/${repository}/migrator@${process.env.MIGRATOR_DIGEST}`,
            },
          };
          writeFileSync("release.json", `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          node scripts/release-manifest.mjs release.json

      - name: Upload release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: release.json
          if-no-files-found: error
          retention-days: 90
