name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: werewolf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install visual fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-noto-extra

      - name: Test migrations and legacy upgrades
        run: pnpm test:migrations
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/werewolf_test

      - name: Verify
        run: pnpm verify
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/werewolf_test
          BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-32-chars-min
          GAME_TOKEN_SECRET: ci-only-secret-that-is-long-enough-32-chars-min
          BETTER_AUTH_URL: https://werewolf.example.com
          NEXT_PUBLIC_APP_URL: https://werewolf.example.com
          OAUTH_MOCK: "true"

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-results
          path: |
            test-results/visual
            test-results/ui-visual
          if-no-files-found: ignore

  containers:
    name: Production containers
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: werewolf_ci
      DB_PASSWORD: ci-postgres-password
      DATABASE_URL: postgres://werewolf:ci-postgres-password@postgres:5432/werewolf
      BETTER_AUTH_SECRET: ci-better-auth-secret-that-is-long-enough
      GAME_TOKEN_SECRET: ci-game-token-secret-that-is-long-enough
      BETTER_AUTH_URL: https://werewolf.example.com
      NEXT_PUBLIC_APP_URL: https://werewolf.example.com
      PUBLIC_WEB_DOMAIN: werewolf.example.com
      PUBLIC_WS_DOMAIN: ws.werewolf.example.com
      NEXT_PUBLIC_GAME_SERVER_URL: wss://ws.werewolf.example.com
      CORS_ORIGIN: https://werewolf.example.com
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      DISCORD_CLIENT_ID: ci-discord-client
      DISCORD_CLIENT_SECRET: ci-discord-secret
      RESEND_API_KEY: ci-resend-key
      RESEND_FROM: Werewolf CI <noreply@werewolf.example.com>
      REPORTS_NOTIFY_EMAIL: reports@werewolf.example.com
      SENTRY_DSN: https://public@example.invalid/1
      RELEASE_VERSION: ci-${{ github.sha }}
      RCLONE_REMOTE: encrypted-offsite:werewolf-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate production environment
        run: node scripts/check-production-env.mjs

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e PUBLIC_WEB_DOMAIN
          -e PUBLIC_WS_DOMAIN
          -e CORS_ORIGIN
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          caddy validate --config /etc/caddy/Caddyfile

      - name: Build production images
        run: docker compose build migrate web game

      - name: Start production services
        run: docker compose up -d postgres migrate web game

      - name: Verify production readiness
        shell: bash
        run: |
          for attempt in {1..45}; do
            postgres_id="$(docker compose ps -q postgres)"
            migrate_id="$(docker compose ps -aq migrate)"
            web_id="$(docker compose ps -q web)"
            game_id="$(docker compose ps -q game)"
            postgres_health="$(docker inspect --format '{{.State.Health.Status}}' "$postgres_id" 2>/dev/null || true)"
            migrate_exit="$(docker inspect --format '{{.State.ExitCode}}' "$migrate_id" 2>/dev/null || true)"
            web_health="$(docker inspect --format '{{.State.Health.Status}}' "$web_id" 2>/dev/null || true)"
            game_health="$(docker inspect --format '{{.State.Health.Status}}' "$game_id" 2>/dev/null || true)"
            if [[ "$postgres_health" == "healthy" && "$migrate_exit" == "0" && "$web_health" == "healthy" && "$game_health" == "healthy" ]]; then
              echo "Production services became ready after $attempt checks."
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs web game migrate
          exit 1

      - name: Start Caddy ingress
        shell: bash
        run: |
          network="${COMPOSE_PROJECT_NAME}_ingress"
          docker network inspect "$network" >/dev/null
          docker run --detach --name werewolf-ci-caddy \
            --network "$network" \
            --publish 127.0.0.1:8080:80 \
            --env PUBLIC_WEB_DOMAIN=http://web.localhost \
            --env PUBLIC_WS_DOMAIN=http://ws.localhost \
            --env CORS_ORIGIN=http://web.localhost \
            --volume "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648

      - name: Verify HTTP and WebSocket ingress
        run: node scripts/container-ingress-smoke.mjs
        env:
          WEB_INGRESS_URL: http://127.0.0.1:8080
          WEB_INGRESS_HOST: web.localhost
          GAME_INGRESS_URL: http://127.0.0.1:8080
          GAME_INGRESS_HOST: ws.localhost
          GAME_WEBSOCKET_URL: ws://127.0.0.1:8080
          ALLOWED_WEB_ORIGIN: http://web.localhost
          FOREIGN_WEB_ORIGIN: https://attacker.invalid
          CADDY_CONTAINER_NAME: werewolf-ci-caddy
          TEST_GAME_OUTAGE: "true"
          TEST_DATABASE_OUTAGE: "true"

      - name: Capture container diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color postgres migrate web game
          docker logs werewolf-ci-caddy 2>&1 || true

      - name: Stop production services
        if: always()
        run: |
          docker rm --force werewolf-ci-caddy 2>/dev/null || true
          docker compose down --volumes --remove-orphans

  loadtest:
    name: Hermetic shared-room load
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: werewolf_load_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d werewolf_load_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build game server
        run: pnpm --filter @werewolf/game-server... build

      - name: Migrate load-test database
        run: pnpm --filter @werewolf/database db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/werewolf_load_test

      - name: Load shared game rooms
        run: pnpm loadtest
        env:
          LOAD_CLIENTS: 30
          LOAD_ROOM_SIZE: 10
          LOAD_HOLD_MS: 10000
          LOAD_JOIN_P95_MS: 3000
          LOAD_MAX_EVENT_LOOP_UTILIZATION: 0.95
          LOAD_MAX_RSS_MB: 512
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/werewolf_load_test
