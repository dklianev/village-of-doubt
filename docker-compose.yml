x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_WEB_DOMAIN: ${PUBLIC_WEB_DOMAIN:?Set PUBLIC_WEB_DOMAIN}
      PUBLIC_WS_DOMAIN: ${PUBLIC_WS_DOMAIN:?Set PUBLIC_WS_DOMAIN}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - ingress
    logging: *default-logging
    mem_limit: ${CADDY_CONTAINER_MEMORY:-128m}
    cpus: ${CADDY_CONTAINER_CPUS:-0.25}
    pids_limit: 128
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "caddy validate --config /etc/caddy/Caddyfile >/dev/null 2>&1 && wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  migrate:
    image: ${MIGRATOR_IMAGE:-werewolf-migrator:${RELEASE_VERSION:-local}}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL with an encoded migrator password}
      PGOPTIONS: >-
        -c lock_timeout=${MIGRATION_LOCK_TIMEOUT_MS:-5000}
        -c statement_timeout=${MIGRATION_STATEMENT_TIMEOUT_MS:-300000}
        -c idle_in_transaction_session_timeout=${MIGRATION_IDLE_TRANSACTION_TIMEOUT_MS:-300000}
    depends_on:
      postgres-roles:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    mem_limit: ${MIGRATOR_CONTAINER_MEMORY:-512m}
    cpus: ${MIGRATOR_CONTAINER_CPUS:-1.0}
    pids_limit: 128

  postgres-grants:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: "no"
    user: postgres
    entrypoint:
      - /bin/sh
      - /opt/werewolf/apply-postgres-roles.sh
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_ROLE_DATABASE:-werewolf}
      PGUSER: werewolf
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?Set MIGRATOR_DB_PASSWORD}
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD:?Set WEB_DB_PASSWORD}
      GAME_DB_PASSWORD: ${GAME_DB_PASSWORD:?Set GAME_DB_PASSWORD}
    volumes:
      - ./scripts/postgres-init/apply-roles.sh:/opt/werewolf/apply-postgres-roles.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    mem_limit: ${POSTGRES_ROLES_CONTAINER_MEMORY:-128m}
    cpus: ${POSTGRES_ROLES_CONTAINER_CPUS:-0.25}
    pids_limit: 64

  web:
    image: ${WEB_IMAGE:-werewolf-web:${RELEASE_VERSION:-local}}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_GAME_SERVER_URL: wss://${PUBLIC_WS_DOMAIN:?Set PUBLIC_WS_DOMAIN}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:?Set NEXT_PUBLIC_SENTRY_DSN}
        RELEASE_VERSION: ${RELEASE_VERSION:?Set RELEASE_VERSION}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
      secrets:
        - better_auth_secrets
        - game_token_secret
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${WEB_DATABASE_URL:?Set WEB_DATABASE_URL with an encoded web password}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-8}
      DATABASE_LOCK_TIMEOUT_MS: ${DATABASE_LOCK_TIMEOUT_MS:-3000}
      DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: ${DATABASE_IDLE_TRANSACTION_TIMEOUT_MS:-10000}
      DATABASE_MAINTENANCE_INTERVAL_MS: ${DATABASE_MAINTENANCE_INTERVAL_MS:-3600000}
      DATABASE_MAINTENANCE_BATCH_SIZE: ${DATABASE_MAINTENANCE_BATCH_SIZE:-1000}
      DATABASE_STALE_LOBBY_HOURS: ${DATABASE_STALE_LOBBY_HOURS:-48}
      DATABASE_STALE_ACTIVE_HOURS: ${DATABASE_STALE_ACTIVE_HOURS:-24}
      DATABASE_EVENT_RETENTION_DAYS: ${DATABASE_EVENT_RETENTION_DAYS:-365}
      REDIS_URL: ${WEB_REDIS_URL:-redis://werewolf_web@redis:6379}
      REDIS_PASSWORD_FILE: /run/secrets/web_redis_password
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_SECRETS: ${BETTER_AUTH_SECRETS:?Set BETTER_AUTH_SECRETS newest-first}
      BETTER_AUTH_LEGACY_TOKENS_RETIRED: ${BETTER_AUTH_LEGACY_TOKENS_RETIRED:-false}
      GAME_TOKEN_SECRET: ${GAME_TOKEN_SECRET:?Set GAME_TOKEN_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL}
      GAME_SERVER_HTTP_URL: http://game:2567
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      REPORTS_NOTIFY_EMAIL: ${REPORTS_NOTIFY_EMAIL:-}
      SENTRY_DSN: ${SENTRY_DSN:?Set SENTRY_DSN}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:?Set NEXT_PUBLIC_SENTRY_DSN}
      NEXT_PUBLIC_GAME_SERVER_URL: wss://${PUBLIC_WS_DOMAIN:?Set PUBLIC_WS_DOMAIN}
      RELEASE_VERSION: ${RELEASE_VERSION:?Set RELEASE_VERSION to an immutable release identifier}
      STATUS_CACHE_TTL_MS: ${STATUS_CACHE_TTL_MS:-20000}
      NODE_OPTIONS: --max-old-space-size=${WEB_NODE_MAX_OLD_SPACE_MB:-560}
    secrets:
      - web_redis_password
    depends_on:
      postgres-grants:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - ingress
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    mem_limit: ${WEB_CONTAINER_MEMORY:-768m}
    cpus: ${WEB_CONTAINER_CPUS:-0.75}
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  game:
    image: ${GAME_IMAGE:-werewolf-game:${RELEASE_VERSION:-local}}
    build:
      context: .
      dockerfile: apps/game-server/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${GAME_DATABASE_URL:?Set GAME_DATABASE_URL with an encoded game password}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-8}
      DATABASE_LOCK_TIMEOUT_MS: ${DATABASE_LOCK_TIMEOUT_MS:-3000}
      DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: ${DATABASE_IDLE_TRANSACTION_TIMEOUT_MS:-10000}
      REDIS_URL: ${GAME_REDIS_URL:-redis://werewolf_security@redis:6379}
      REDIS_PASSWORD_FILE: /run/secrets/game_redis_password
      COLYSEUS_REDIS_URL: ${COLYSEUS_REDIS_URL:-redis://werewolf_colyseus@redis:6379}
      COLYSEUS_REDIS_PASSWORD_FILE: /run/secrets/colyseus_redis_password
      COLYSEUS_PUBLIC_ADDRESS: ${COLYSEUS_PUBLIC_ADDRESS:-}
      GAME_TOKEN_SECRET: ${GAME_TOKEN_SECRET:?Set GAME_TOKEN_SECRET}
      GAME_SERVER_PORT: 2567
      ALLOW_DEV_AUTH: "false"
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
      PUBLIC_WEB_DOMAIN: ${PUBLIC_WEB_DOMAIN:?Set PUBLIC_WEB_DOMAIN}
      SENTRY_DSN: ${SENTRY_DSN:?Set SENTRY_DSN}
      RELEASE_VERSION: ${RELEASE_VERSION:?Set RELEASE_VERSION to an immutable release identifier}
      GAME_DRAIN_TIMEOUT_MS: ${GAME_DRAIN_TIMEOUT_MS:-120000}
      GAME_DRAIN_POLL_INTERVAL_MS: ${GAME_DRAIN_POLL_INTERVAL_MS:-1000}
      GAME_DEPLOY_DRAIN_MAX_AGE_MS: ${GAME_DEPLOY_DRAIN_MAX_AGE_MS:-3600000}
      GAME_REDIS_CLOSE_TIMEOUT_MS: ${GAME_REDIS_CLOSE_TIMEOUT_MS:-5000}
      NODE_OPTIONS: --max-old-space-size=${GAME_NODE_MAX_OLD_SPACE_MB:-800}
    secrets:
      - game_redis_password
      - colyseus_redis_password
    depends_on:
      postgres-grants:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - ingress
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    mem_limit: ${GAME_CONTAINER_MEMORY:-1024m}
    cpus: ${GAME_CONTAINER_CPUS:-1.25}
    pids_limit: 256
    # 120s pre-shutdown drain + 110s terminal room flush + 5s Redis/DB close + headroom.
    stop_grace_period: 260s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2567/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_USER: werewolf
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: werewolf
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=${POSTGRES_SLOW_QUERY_MS:-500}
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - "log_line_prefix=%m [%p] user=%u db=%d app=%a client=%r "
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    logging: *default-logging
    mem_limit: ${POSTGRES_CONTAINER_MEMORY:-1024m}
    cpus: ${POSTGRES_CONTAINER_CPUS:-0.75}
    shm_size: ${POSTGRES_SHARED_MEMORY:-128m}
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werewolf -d werewolf"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres-roles:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: "no"
    user: postgres
    entrypoint:
      - /bin/sh
      - /opt/werewolf/apply-postgres-roles.sh
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_ROLE_DATABASE:-werewolf}
      PGUSER: werewolf
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?Set MIGRATOR_DB_PASSWORD}
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD:?Set WEB_DB_PASSWORD}
      GAME_DB_PASSWORD: ${GAME_DB_PASSWORD:?Set GAME_DB_PASSWORD}
    volumes:
      - ./scripts/postgres-init/apply-roles.sh:/opt/werewolf/apply-postgres-roles.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    mem_limit: ${POSTGRES_ROLES_CONTAINER_MEMORY:-128m}
    cpus: ${POSTGRES_ROLES_CONTAINER_CPUS:-0.25}
    pids_limit: 64

  redis:
    image: redis:8.2-alpine@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /opt/werewolf/redis-entrypoint.sh
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      # Keep half the cgroup budget available for AOF rewrite and allocator peaks.
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - noeviction
    environment:
      WEB_REDIS_PASSWORD_FILE: /run/secrets/web_redis_password
      GAME_REDIS_PASSWORD_FILE: /run/secrets/game_redis_password
      COLYSEUS_REDIS_PASSWORD_FILE: /run/secrets/colyseus_redis_password
    secrets:
      - web_redis_password
      - game_redis_password
      - colyseus_redis_password
    volumes:
      - redis_data:/data
      - ./scripts/redis-entrypoint.sh:/opt/werewolf/redis-entrypoint.sh:ro
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging: *default-logging
    mem_limit: ${REDIS_CONTAINER_MEMORY:-256m}
    cpus: ${REDIS_CONTAINER_CPUS:-0.25}
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user werewolf_security --pass \"$$(cat /run/secrets/game_redis_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:

networks:
  ingress:
  backend:
    internal: true

secrets:
  better_auth_secrets:
    environment: BETTER_AUTH_SECRETS
  game_token_secret:
    environment: GAME_TOKEN_SECRET
  web_redis_password:
    environment: WEB_REDIS_PASSWORD
  game_redis_password:
    environment: GAME_REDIS_PASSWORD
  colyseus_redis_password:
    environment: COLYSEUS_REDIS_PASSWORD
